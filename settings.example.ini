; Copy to settings.ini next to OpenRouterBar.exe (in %LOCALAPPDATA%\Programs\OpenRouterBar) and
; restart the widget. Every line is optional.

; Seconds between checks (60-3600). Failed checks back off up to 3600.
IntervalSec=600

; Text left of the bar (up to 8 characters).
Label=OR

; Bar and text colors.
FillColor=#14B8A6
TextColor=#2DD4BF

; Pixels between this widget and the Claude Code Usage Monitor, when that is running.
GapPx=6
